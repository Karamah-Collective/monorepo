name = "maps"
compatibility_date = "2026-08-04"

# Local development configuration only. No pages_build_output_dir: deployed
# Pages bindings stay managed in the Cloudflare dashboard. Keep Production and
# Preview bound to their existing separate D1 databases. See ../DEPLOYMENT.md.
[[d1_databases]]
binding = "DB"
database_name = "halal-finder-db"
database_id = "a360600d-c92c-42c4-a41b-fe493866f13f"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "manarah-media"

[[durable_objects.bindings]]
name = "INBOX_REALTIME"
class_name = "InboxRealtime"
script_name = "manarah-gmail-events"

[env.preview]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "halal-finder-db-preview"
database_id = "13c3fa62-68a5-4e51-adf8-8c668abfd9c9"

[[env.preview.r2_buckets]]
binding = "MEDIA"
bucket_name = "manarah-media-preview"

[[env.preview.durable_objects.bindings]]
name = "INBOX_REALTIME"
class_name = "InboxRealtime"
script_name = "manarah-gmail-events-preview"
