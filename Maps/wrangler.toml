name = "maps"
compatibility_date = "2026-08-04"

# Local development configuration only. No pages_build_output_dir: deployed
# Pages bindings stay managed in the Cloudflare dashboard. Keep Production and
# Preview bound to their existing separate D1 databases. See ../DEPLOYMENT.md.
[[d1_databases]]
binding = "DB"
database_name = "halal-finder-db"
database_id = "a360600d-c92c-42c4-a41b-fe493866f13f"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "manarah-media"

[[d1_databases]]
binding = "FORMS_DB"
database_name = "forms-db"
database_id = "3237f544-7c01-41cb-802b-20e1d1c1ad0a"

[[r2_buckets]]
binding = "FORMS_MEDIA"
bucket_name = "forms-media"
