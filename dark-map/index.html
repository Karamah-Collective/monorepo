<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dark Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="10" r="3"/>
            <path d="M12 2a8 8 0 0 0-8 8c0 5.4 7.05 11.5 7.35 11.76a1 1 0 0 0 1.3 0C13 21.5 20 15.4 20 10a8 8 0 0 0-8-8z"/>
          </svg>
          <span>Dark Map</span>
        </div>
      </div>

      <div class="sidebar-body">
        <div class="control-group">
          <label class="control-label">Theme Intensity</label>
          <input type="range" id="darknessSlider" min="0" max="100" value="35" />
          <div class="range-labels">
            <span>Light</span>
            <span>Dark</span>
          </div>
        </div>

        <div class="control-group">
          <label class="control-label">Color Vibrancy</label>
          <input type="range" id="saturationSlider" min="50" max="200" value="160" />
          <div class="range-labels">
            <span>Muted</span>
            <span>Vivid</span>
          </div>
        </div>

        <div class="control-group">
          <label class="control-label">Warmth</label>
          <input type="range" id="warmthSlider" min="0" max="40" value="20" />
          <div class="range-labels">
            <span>Cool</span>
            <span>Warm</span>
          </div>
        </div>

        <div class="control-group">
          <label class="control-label">Map Style</label>
          <div class="style-buttons">
            <button class="style-btn" data-style="dark">Dark</button>
            <button class="style-btn" data-style="midnight">Midnight</button>
            <button class="style-btn active" data-style="twilight">Twilight</button>
            <button class="style-btn" data-style="ocean">Ocean</button>
          </div>
        </div>

        <div class="separator"></div>

        <div class="control-group">
          <label class="control-label">Search Location</label>
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Enter a place name…" />
            <button id="searchBtn" aria-label="Search">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="control-group">
          <label class="control-label">Coordinates</label>
          <div id="coordsDisplay" class="coords-display">
            <span id="latDisplay">Lat: —</span>
            <span id="lngDisplay">Lng: —</span>
          </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <button id="locateBtn" class="action-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
            <circle cx="12" cy="12" r="4"/>
          </svg>
          My Location
        </button>
        <div class="credits">
          &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors
        </div>
      </div>
    </div>

    <div id="map"></div>
  </div>

  <button id="sidebarToggle" aria-label="Toggle sidebar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
