name: Weekly analytics report

on:
  schedule:
    # The endpoint decides whether a report is due based on Admin settings.
    - cron: "6 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate analytics without sending email"
        required: false
        default: false
        type: boolean

jobs:
  send-weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Pages report endpoint
        env:
          REPORT_SECRET: ${{ secrets.REPORT_SECRET }}
          REPORT_URL: ${{ vars.REPORT_URL }}
        run: |
          set -euo pipefail
          url="${REPORT_URL:-https://maps.karamahcollective.com/api/weekly-report}"
          payload='{}'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              payload='{"dryRun":true,"force":true}'
            else
              payload='{"manual":true}'
            fi
          fi
          curl --fail-with-body --show-error --silent \
            --request POST "$url" \
            --header "Authorization: Bearer ${REPORT_SECRET}" \
            --header "Content-Type: application/json" \
            --data "$payload"
