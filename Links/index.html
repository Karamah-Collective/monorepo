<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1efe7">
  <meta name="description" content="Karamah Collective links.">
  <meta property="og:title" content="Karamah Collective — Links">
  <meta property="og:description" content="Karamah Collective links.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Karamah Collective — Links">
  <meta name="twitter:description" content="Karamah Collective links.">
  <title>Karamah Collective — Links</title>
  <link rel="icon" href="/assets/favicon.ico">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <main class="page" id="page" aria-live="polite">
    <header class="masthead">
      <a class="brand" id="brand-link" href="https://karamahcollective.com" aria-label="Karamah Collective">
        <img src="/assets/karamah-logo.webp" alt="">
        <span id="brand-name">Karamah Collective</span>
      </a>
      <button class="page-share" id="profile-share" type="button" aria-label="Share this page">
        <span id="profile-share-label">Share</span>
        <i aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 15.5V4m0 0-4 4m4-4 4 4M5.5 12.5v5.1c0 .8.6 1.4 1.4 1.4h10.2c.8 0 1.4-.6 1.4-1.4v-5.1"/></svg>
        </i>
      </button>
    </header>

    <section class="profile-panel">
      <div class="profile-portrait" id="profile-portrait">
        <div class="portrait-core"><img id="profile-image" src="/assets/karamah-logo.webp" alt="Karamah Collective"></div>
        <span class="portrait-orbit" aria-hidden="true"></span>
      </div>
      <div class="profile-copy">
        <span class="kicker" id="page-kicker"></span>
        <h1 id="profile-name">Karamah Collective</h1>
        <p id="profile-bio"></p>
      </div>
    </section>

    <section class="socials" id="socials-section" aria-label="Social profiles" hidden>
      <header class="socials-head" hidden>
        <span class="kicker" id="socials-kicker"></span>
        <h2 id="socials-heading"></h2>
        <p id="socials-description"></p>
      </header>
      <div class="social-list" id="social-links"></div>
    </section>

    <section class="directory" aria-label="Links">
      <header class="directory-head" hidden>
        <div class="directory-copy">
          <span class="kicker" id="links-kicker"></span>
          <h2 id="links-heading"></h2>
          <p id="links-description"></p>
        </div>
        <span class="count" id="link-count"></span>
      </header>
      <div class="links" id="links">
        <div class="skeleton" aria-label="Loading links"><i></i><span></span></div>
        <div class="skeleton"><i></i><span></span></div>
        <div class="skeleton"><i></i><span></span></div>
      </div>
      <div class="state" id="state" hidden></div>
    </section>

    <footer class="site-footer">
      <div class="footer-mark"><span></span><p id="footer-text"></p></div>
      <a id="footer-link" href="https://karamahcollective.com" rel="noreferrer">
        <span id="footer-link-label"></span>
        <i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16 16 8m-6 0h6v6"/></svg></i>
      </a>
    </footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
