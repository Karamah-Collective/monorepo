<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#1A73B8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Helsinki Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <!-- Map (full screen) -->
  <div id="map"></div>

  <!-- ─── Search Pill (above zoom pill) ─── -->
  <div id="search-card" class="collapsed">
    <button id="search-pill" aria-label="Search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
    </button>
    <div id="search-expanded">
      <div id="search-box">
        <svg class="sb-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="search-input" type="text" placeholder="Search Helsinki…" autocomplete="off" spellcheck="false" />
        <button id="clear-input" class="clear-btn hide" aria-label="Clear">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="search-drop" class="hide">
        <ul id="results-list"></ul>
      </div>
    </div>
  </div>

  <!-- ─── Zoom Pill (bottom-right, always visible) ─── -->
  <div id="zoom-pill">
    <button id="zoomin-btn" aria-label="Zoom in">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div class="zp-div"></div>
    <button id="zoomout-btn" aria-label="Zoom out">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg>
    </button>
  </div>

  <!-- ─── Tab Bar + Zoom ─── -->
  <nav id="tab-bar">
    <button id="home-btn" class="tab" aria-label="Home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 21v-8a1 1 0 00-1-1h-4a1 1 0 00-1 1v8"/><path d="M3 10a2 2 0 01.709-1.528l7-5.999a2 2 0 012.582 0l7 5.999A2 2 0 0121 10v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
      </svg>
      <span>Home</span>
    </button>
    <button id="dir-btn" class="tab" aria-label="Directions">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 18l4-4 4 4 4-8 4 4"/>
        <circle cx="7" cy="14" r="1.5" fill="currentColor" stroke="none"/>
        <circle cx="19" cy="14" r="1.5" fill="currentColor" stroke="none"/>
      </svg>
      <span>Routes</span>
    </button>
    <button id="pins-btn" class="tab" aria-label="Saved places">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 17.75l-6.172 3.245 1.179-6.873-5-4.867 6.9-1.002L12 2l3.093 6.253 6.9 1.002-5 4.867 1.179 6.873z"/>
      </svg>
      <span>Saved</span>
      <span id="badge" class="badge hide">0</span>
    </button>
    <button id="locate-btn" class="tab" aria-label="My location">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11l19-9-9 19-2-8-8-2z"/>
      </svg>
      <span>Locate</span>
    </button>
  </nav>

  <!-- ─── Directions Sheet (bottom) ─── -->
  <div id="dir-panel" class="sheet shut">
    <div id="dir-drag" class="sheet-drag"><span></span></div>
    <div id="dir-head" class="sheet-head">
      <h2>Directions</h2>
      <button id="dir-clear-route" class="dir-clear-btn hide" aria-label="Clear route">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        Clear
      </button>
      <button id="dir-close" class="sheet-x" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Focused route header (shown in focus mode) -->
    <div id="dir-focused-head">
      <div class="focused-top-row">
        <button id="dir-focused-back" aria-label="Back to results">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <h2 id="dir-focused-title">Route Details</h2>
        <button id="dir-focused-close" class="sheet-x" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="focused-route-summary">
        <div class="focused-endpoints">
          <div class="focused-ep"><span class="dir-dot origin"></span><span id="focused-origin">Origin</span></div>
          <svg class="focused-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          <div class="focused-ep"><span class="dir-dot dest"></span><span id="focused-dest">Destination</span></div>
        </div>
        <div id="focused-chain" class="itin-chain"></div>
        <div id="focused-meta" class="focused-meta"></div>
      </div>
    </div>

    <div id="dir-inputs">
      <div class="dir-fields-col">
        <div class="dir-field-wrap">
          <div class="dir-field" id="dir-field-from">
            <span class="dir-dot origin"></span>
            <input id="dir-from" type="text" placeholder="Origin — tap map or type" autocomplete="off" />
            <button class="dir-field-btn dir-my-loc" title="Use my location">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>
            </button>
          </div>
          <ul id="dir-from-suggest" class="dir-suggest hide"></ul>
        </div>
        <div class="dir-field-wrap">
          <div class="dir-field" id="dir-field-to">
            <span class="dir-dot dest"></span>
            <input id="dir-to" type="text" placeholder="Destination — tap map or type" autocomplete="off" />
          </div>
          <ul id="dir-to-suggest" class="dir-suggest hide"></ul>
        </div>
      </div>
      <button id="dir-swap" title="Swap origin & destination">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 16V4M7 4l-4 4M7 4l4 4M17 8v12M17 20l4-4M17 20l-4-4"/>
        </svg>
      </button>
    </div>

    <div id="dir-time-bar">
      <div class="time-row">
        <div id="dir-time-toggle">
          <button class="time-opt active" data-mode="depart">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            Depart
          </button>
          <button class="time-opt" data-mode="arrive">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            Arrive
          </button>
        </div>
        <button id="dir-time-now" class="time-chip active">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          Now
        </button>
      </div>
      <div id="dir-custom-time-row">
        <div class="custom-date-wrap" id="date-trigger">
          <svg class="field-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <input type="text" id="dir-date" readonly />
        </div>
        <div class="custom-time-wrap" id="time-trigger">
          <svg class="field-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          <input type="text" id="dir-time" readonly />
        </div>
      </div>
    </div>

    <button id="dir-go" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      Find Routes
    </button>

    <div id="dir-results">
      <div id="dir-empty"></div>
      <div id="dir-loading" class="hide">
        <div class="spinner"></div>
        <span>Finding routes…</span>
      </div>
      <div id="dir-error" class="hide"></div>
      <div id="dir-itineraries"></div>
    </div>
  </div>

  <!-- ─── Saved Places Sheet (bottom) ─── -->
  <div id="pin-sheet" class="sheet shut">
    <div id="sheet-drag" class="sheet-drag"><span></span></div>
    <div id="sheet-head" class="sheet-head">
      <h2>Saved Places</h2>
      <span id="pin-ct"></span>
      <button id="sheet-close" class="sheet-x" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="sheet-scroll">
      <ul id="pin-list"></ul>
      <div id="empty-pins">
        <p>No saved places yet</p>
        <span>Search or double-tap the map to save a spot</span>
      </div>
    </div>
  </div>

  <!-- ─── Route Snackbar ─── -->
  <div id="route-snackbar" class="hide">
    <div id="snackbar-body">
      <svg class="snackbar-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18l4-4 4 4 4-8 4 4"/></svg>
      <div id="snackbar-content">
        <div id="snackbar-title">Route active</div>
        <div id="snackbar-sub"></div>
      </div>
    </div>
    <button id="snackbar-close" aria-label="Clear route">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <!-- Scrim -->
  <div id="scrim" class="hide"></div>
</div>

<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
